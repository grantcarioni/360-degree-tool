name: CI/CD — Build & Deploy to Azure (App Service + PostgreSQL)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  AZURE_WEBAPP_NAME: 'ni-360-app'
  AZURE_RESOURCE_GROUP: 'hrstack-rg'
  AZURE_LOCATION: 'eastus2'
  PG_SERVER_NAME: 'ni-360-pg'
  PG_DB_NAME: 'ni-360-db'
  PG_ADMIN_USER: 'ni360admin'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json
      - name: Install dependencies
        run: |
          cd v2
          npm install
      - name: Build application
        run: |
          cd v2
          npm run build
      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          cp -r v2/dist deploy-package/
          cp -r v2/server deploy-package/
          cp v2/package.json deploy-package/
          cd deploy-package && npm install --omit=dev
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: deploy-package/

  provision-db:
    name: Provision PostgreSQL
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      pg-fqdn: ${{ steps.provision.outputs.fqdn }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Provision PostgreSQL Flexible Server
        id: provision
        run: |
          EXISTS=$(az postgres flexible-server show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.PG_SERVER_NAME }} --query "name" -o tsv 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            az postgres flexible-server create --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.PG_SERVER_NAME }} --location ${{ env.AZURE_LOCATION }} --admin-user ${{ env.PG_ADMIN_USER }} --admin-password "${{ secrets.PG_ADMIN_PASSWORD }}" --sku-name Standard_B1ms --tier Burstable --storage-size 32 --version 16 --yes
          fi
          FQDN=$(az postgres flexible-server show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.PG_SERVER_NAME }} --query "fullyQualifiedDomainName" -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          az postgres flexible-server db show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --server-name ${{ env.PG_SERVER_NAME }} --database-name ${{ env.PG_DB_NAME }} 2>/dev/null || az postgres flexible-server db create --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --server-name ${{ env.PG_SERVER_NAME }} --database-name ${{ env.PG_DB_NAME }}
          az postgres flexible-server firewall-rule create --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.PG_SERVER_NAME }} --rule-name AllowAzureServices --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0 2>/dev/null || true

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Configure App Service
        run: |
          az webapp config appsettings set --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_WEBAPP_NAME }} --settings DATABASE_URL="postgresql://${{ env.PG_ADMIN_USER }}:${{ secrets.PG_ADMIN_PASSWORD }}@${{ needs.provision-db.outputs.pg-fqdn }}:5432/${{ env.PG_DB_NAME }}?sslmode=require" NODE_ENV="production"
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: deploy-package
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy-package
          startup-command: 'npx tsx server/index.ts'
